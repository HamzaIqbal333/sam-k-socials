<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sam K. Socials</title>
    <script>
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Encodes the path GitHub Pages couldn't find a file for, and sends the visitor back to
      // index.html, which un-packs it (see the script in index.html's <head>) and lets React
      // Router take over. pathSegmentsToKeep=1 keeps the repo name segment, e.g. /sam-k-socials.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
